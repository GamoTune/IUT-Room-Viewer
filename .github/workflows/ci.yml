name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Même version qu'en local : un écart de Bun change le résolveur, le runner de
  # tests et le rapport de couverture.
  BUN_VERSION: "1.3.14"

jobs:
  # En premier et sans dépendance : c'est la vérification la moins chère, celle
  # qui rend la main en quelques secondes sur une faute de style ou un import mort.
  quality:
    name: Lint et format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Mettre en cache les paquets
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # `--check` et non `--write` : la CI constate, elle ne réécrit pas le dépôt.
      - name: Format
        run: bun run format:check

  server:
    name: Serveur - Types et tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Mettre en cache les paquets
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Installer les dépendances
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Vérification des types
        run: bun run typecheck

      - name: Tests et seuil de couverture
        run: bun run coverage

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-server
          path: server/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # L'image sert de preuve : le serveur démarre ailleurs que sur le poste de
  # développement, avec une vraie base, et répond.
  container:
    name: Conteneur - Image et test de fumée
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Le cache est porté par GitHub : sans lui, chaque exécution réinstalle
      # toutes les dépendances dans l'image.
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: iut-room-viewer-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Taille de l'image
        run: docker image inspect iut-room-viewer-server:ci --format '{{.Size}}' | numfmt --to=iec

      # `--wait` s'appuie sur le HEALTHCHECK de l'image et sur celui de PostgreSQL :
      # la commande ne rend la main que si la pile est réellement en bon état.
      - name: Démarrer la pile
        run: docker compose up -d --wait

      # Le script du dépôt, tel quel : la CI n'invente pas sa propre commande.
      - name: Appliquer les migrations
        run: docker compose exec -T api bun run db:migrate

      - name: Test de fumée
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/rooms | tee /dev/stderr | grep -q '"success":true'

      - name: Journaux de la pile
        if: failure()
        run: docker compose logs --no-color

      - name: Arrêter la pile
        if: always()
        run: docker compose down --volumes

  sonar:
    name: Serveur - Analyse SonarQube Cloud
    # Sans tests verts, la couverture est absente et la Quality Gate n'a pas de sens.
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : SonarQube s'en sert pour distinguer le nouveau code
          # et attribuer chaque problème à son commit.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Mettre en cache les paquets
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Les types des dépendances rendent l'analyse TypeScript plus précise.
      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Récupérer le rapport de couverture
        uses: actions/download-artifact@v4
        with:
          name: coverage-server
          path: server/coverage

      # Configuration dans server/sonar-project.properties.
      - name: Analyse SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: server
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
