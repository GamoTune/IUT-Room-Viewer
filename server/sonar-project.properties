# ============================================
# Analyse SonarQube Cloud du serveur
#
# Lancée par le job `sonar` de .github/workflows/ci.yml, depuis `server/` : le
# rapport LCOV de Bun y écrit ses chemins relativement (`SF:src/...`).
#
# L'analyse automatique doit être désactivée côté SonarQube Cloud
# (Administration → Analysis Method) : elle entre en conflit avec celle-ci et
# ne connaîtrait pas la couverture.
# ============================================

sonar.organization=Arthur Labregere
sonar.projectKey=gamotune
sonar.projectName=Arthur Labregere

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Générées par TypeORM : ni revues ni maintenues à la main.
sonar.exclusions=src/migrations/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Mêmes exclusions que `coveragePathIgnorePatterns` dans bunfig.toml, pour que
# SonarQube et `bun run coverage` parlent du même périmètre. À tenir alignées.
sonar.coverage.exclusions=\
    **/entities/**,\
    **/types/**,\
    **/migrations/**,\
    **/api/**,\
    **/cli/**,\
    src/index.ts,\
    src/utils/dataSource.ts

# Le job échoue si la Quality Gate n'est pas passée, au lieu de seulement
# publier un rapport que personne ne regarde.
sonar.qualitygate.wait=true
